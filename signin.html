<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In MovieTime</title>
<link rel="icon" type="png" href="logo.png">
  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(to right,#f0eeee,#aba8a8);
    }

    .login-box{
      width:400px;
      background:white;
      padding:40px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    h1{
      text-align:center;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:15px;
      margin-bottom:20px;
      border:1px solid #ccc;
      border-radius:10px;
      outline:none;
    }

    button{
      width:100%;
      padding:15px;
      background:#ff416c;
      color:white;
      border:none;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
    }

    button:hover{
      background:#e9325c;
    }

    .back{
      display:block;
      margin-top:20px;
      text-align:center;
      text-decoration:none;
      color:#333;
      font-weight:bold;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <h1>Sign In</h1>

    <input type="email" placeholder="Enter Email" required>

    <input type="password" placeholder="Enter Password">

    <button onclick="login()">
      Login
    </button>

    <a href="bookmyshow.html" class="back">
      ← Back to Home
    </a>

  </div>

  <script>

    function login(){
      alert("Login Successful!");
      window.location.href = "bookmyshow.html";
    }

  </script>

</body>
</html>
